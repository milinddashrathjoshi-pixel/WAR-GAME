name: Web Build & Deploy

# Builds the Godot project as an HTML5/Web export and publishes it to
# GitHub Pages so it can be played in any browser (including mobile Safari).

on:
  push:
    branches: ["claude/war-ops-grid-placement-d6Spm"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import resources
        run: godot --headless --import
        continue-on-error: true

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" "$PWD/build/web/index.html"

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
