<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Village Wars</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏯</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="pill th"><span id="thBadge">TH 1</span></div>
    <div class="pill res">
      <span class="ico">🪙</span>
      <div class="meter"><div id="goldBar" class="fill gold"></div></div>
      <span class="amt" id="goldTxt">0</span>
    </div>
    <div class="pill res">
      <span class="ico">⚗️</span>
      <div class="meter"><div id="elixBar" class="fill elix"></div></div>
      <span class="amt" id="elixTxt">0</span>
    </div>
    <div class="pill"><span class="ico">🏆</span><span class="amt" id="trophyTxt">0</span></div>
    <div class="pill"><span class="ico">⛺</span><span class="amt" id="armyTxt">0/20</span></div>
  </div>

  <div id="homebar" class="bottombar">
    <button id="btnShop" class="bigbtn"><span class="bico">🛒</span><span>Shop</span></button>
    <button id="btnArmy" class="bigbtn"><span class="bico">⚔️</span><span>Army</span></button>
    <button id="btnAttack" class="bigbtn attack"><span class="bico">🗺️</span><span>Attack!</span></button>
    <button id="btnHelp" class="bigbtn"><span class="bico">❓</span><span>Help</span></button>
  </div>

  <div id="battlebar" class="bottombar hidden">
    <div id="troopChips"></div>
    <div id="battleInfo">
      <span id="bTimer">3:00</span>
      <span id="bPct">0%</span>
      <span id="bStars">☆☆☆</span>
      <span id="bLoot"></span>
    </div>
    <button id="btnNext" class="btn">🔄 Next village</button>
    <button id="btnEndBattle" class="btn danger">🏳️ Surrender</button>
  </div>

  <div id="panel" class="hidden"></div>
  <div id="placeHint" class="hidden">
    Tap a green spot to place · right&#8209;click / Esc to stop
    <button id="btnCancelPlace" class="btn">Cancel</button>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<div id="modalWrap" class="hidden">
  <div id="modal">
    <button id="modalClose">✖</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/battle.js"></script>
</body>
</html>
