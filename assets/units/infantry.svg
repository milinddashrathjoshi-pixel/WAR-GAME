<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Infantry: top-down soldier — backpack, shoulders, helmet, rifle -->
  <!-- shadow base -->
  <ellipse cx="64" cy="68" rx="34" ry="34" fill="#3a4a22" opacity="0.35"/>
  <!-- backpack / torso -->
  <rect x="40" y="40" width="48" height="52" rx="14" fill="#55642f" stroke="#3a4a22" stroke-width="4"/>
  <!-- shoulders -->
  <circle cx="40" cy="58" r="13" fill="#4a5828"/>
  <circle cx="88" cy="58" r="13" fill="#4a5828"/>
  <!-- rifle pointing forward (down-screen) -->
  <rect x="59" y="64" width="10" height="52" rx="3" fill="#1f2937"/>
  <rect x="55" y="86" width="18" height="8" rx="2" fill="#111827"/>
  <!-- helmet (top of head) -->
  <circle cx="64" cy="60" r="20" fill="#6b7d39" stroke="#3a4a22" stroke-width="4"/>
  <circle cx="64" cy="60" r="9" fill="#566529"/>
</svg>
